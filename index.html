<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Scoreboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--accent);
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .leaderboard { 
            width: 100%;
            max-width: 500px; 
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-row { 
            background: var(--card-bg); 
            padding: 16px 20px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 1.25rem; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rank {
            font-weight: 800;
            color: var(--text-muted);
            font-size: 1.5rem;
            min-width: 30px;
        }

        .score-pill {
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 1.1rem;
        }

        .top-rank { 
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); 
            color: #451a03; 
            transform: scale(1.03); 
            box-shadow: 0 10px 20px -5px rgba(251, 191, 36, 0.4); 
        }

        .top-rank .rank, .top-rank .score-pill {
            color: #451a03;
            background: rgba(255, 255, 255, 0.3);
        }

        /* ── Streak badge ── */
        .streak-badge {
            font-size: 0.78rem;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 20px;
            background: rgba(249,115,22,0.18);
            color: #fb923c;
            white-space: nowrap;
            margin-left: 6px;
        }
        .top-rank .streak-badge {
            background: rgba(0,0,0,0.15);
            color: #7c2d12;
        }
        .streak-badge .streak-icon {
            display: inline-block;
            animation: flicker 1.2s ease-in-out infinite;
        }
        @keyframes flicker {
            0%, 100% { transform: scale(1);   opacity: 1; }
            50%       { transform: scale(1.15); opacity: 0.8; }
        }
        @keyframes streakPop {
            0%   { transform: scale(0.6); opacity: 0; }
            60%  { transform: scale(1.2); }
            100% { transform: scale(1);   opacity: 1; }
        }
        .streak-new { animation: streakPop 0.4s ease both; }

        /* ── Row & score animations ── */
        @keyframes slideInRow {
            from { opacity: 0; transform: translateX(40px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes rankUp {
            0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0); background-color: inherit; }
            20%  { box-shadow: 0 0 0 3px rgba(34,197,94,0.7); background-color: rgba(34,197,94,0.18); }
            100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); background-color: inherit; }
        }
        @keyframes rankDown {
            0%   { box-shadow: 0 0 0 0 rgba(239,68,68,0); background-color: inherit; }
            20%  { box-shadow: 0 0 0 3px rgba(239,68,68,0.7); background-color: rgba(239,68,68,0.18); }
            100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); background-color: inherit; }
        }
        @keyframes scoreFlash {
            0%   { transform: scale(1);    background: rgba(255,255,255,0.1); color: inherit; }
            30%  { transform: scale(1.25); background: rgba(251,191,36,0.5);  color: #fff; }
            100% { transform: scale(1);    background: rgba(255,255,255,0.1); color: inherit; }
        }
        @keyframes scoreFlashTop {
            0%   { transform: scale(1);    background: rgba(255,255,255,0.3); color: #451a03; }
            30%  { transform: scale(1.25); background: rgba(255,255,255,0.7); color: #451a03; }
            100% { transform: scale(1);    background: rgba(255,255,255,0.3); color: #451a03; }
        }

        .row-slide-in  { animation: slideInRow 0.35s ease both; }
        .row-rank-up   { animation: rankUp   0.7s ease both; }
        .row-rank-down { animation: rankDown 0.7s ease both; }
        .score-changed      { animation: scoreFlash    0.55s ease both; }
        .score-changed-top  { animation: scoreFlashTop 0.55s ease both; }

        .footer-links {
            margin-top: auto;
            padding-top: 18px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .footer-link {
            font-size: 0.82rem;
            color: var(--text-muted);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 14px;
            font-weight: 600;
            transition: color 0.2s, border-color 0.2s;
        }

        .footer-link:hover { color: var(--accent); border-color: var(--accent); }

        .footer-btn {
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 14px;
            color: var(--text-muted);
            font: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            transition: color 0.2s, border-color 0.2s;
        }

        .footer-btn:hover { color: var(--accent); border-color: var(--accent); }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .player-row { padding: 12px 15px; font-size: 1.1rem; }
            .rank { font-size: 1.25rem; }
        }

        /* ── Live chart ── */
        #chart-section {
            display: none;
            width: 100%;
            max-width: 500px;
            margin-top: 24px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
        }

        .chart-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-title span { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 0.68rem; }

        .live-chart { width: 100%; height: auto; display: block; overflow: visible; }

        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            margin-top: 8px;
            justify-content: center;
        }
        .chart-legend-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.74rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .chart-legend-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Bar grow from baseline */
        @keyframes barGrow {
            from { transform: scaleY(0); }
            to   { transform: scaleY(1); }
        }
        /* Line draw (stroke-dashoffset) */
        @keyframes lineDraw {
            from { stroke-dashoffset: 1200; }
            to   { stroke-dashoffset: 0; }
        }
        /* Dot pop */
        @keyframes dotPop {
            0%   { r: 0; opacity: 0; }
            60%  { r: 6px; }
            100% { r: 4px; opacity: 1; }
        }

        /* ── Waiting screen ── */
        #waiting-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 0;
            padding: 40px 20px;
            text-align: center;
        }
        #waiting-screen.visible { display: flex; }

        /* Floating dice ring */
        .dice-ring {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 36px;
        }
        .dice-center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.8rem;
            animation: breathe 3s ease-in-out infinite;
            filter: drop-shadow(0 0 18px rgba(59,130,246,0.6));
        }
        .dice-orbit {
            position: absolute;
            font-size: 1.6rem;
            animation: orbit 6s linear infinite;
            transform-origin: 80px 80px;
            filter: drop-shadow(0 0 6px rgba(59,130,246,0.4));
        }
        .dice-orbit:nth-child(2) { animation-delay: -2s; }
        .dice-orbit:nth-child(3) { animation-delay: -4s; }

        @keyframes breathe {
            0%, 100% { transform: scale(1) rotate(-4deg); }
            50%       { transform: scale(1.12) rotate(4deg); }
        }
        @keyframes orbit {
            from { transform: rotate(0deg) translateX(68px) rotate(0deg); }
            to   { transform: rotate(360deg) translateX(68px) rotate(-360deg); }
        }

        /* Waiting text */
        .waiting-heading {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .waiting-heading .dots span {
            animation: blink 1.4s infinite;
            opacity: 0;
        }
        .waiting-heading .dots span:nth-child(2) { animation-delay: 0.2s; }
        .waiting-heading .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40%            { opacity: 1; }
        }

        .waiting-sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        /* Floating background dice */
        .bg-dice {
            position: fixed;
            font-size: 1.4rem;
            opacity: 0.07;
            pointer-events: none;
            animation: floatUp linear infinite;
            user-select: none;
        }
        @keyframes floatUp {
            0%   { transform: translateY(0) rotate(0deg);   opacity: 0;    }
            10%  { opacity: 0.07; }
            90%  { opacity: 0.07; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* Live pulse badge */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
            50%       { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
        }
    </style>
</head>
<body>
    <h1 id="gameTitle" style="display:none"></h1>

    <!-- Waiting screen (shown when no active game) -->
    <div id="waiting-screen" class="visible">
        <div class="dice-ring">
            <div class="dice-center">🎲</div>
            <div class="dice-orbit" style="top:0;left:0;">♟️</div>
            <div class="dice-orbit" style="top:0;left:0;">🃏</div>
            <div class="dice-orbit" style="top:0;left:0;">🎯</div>
        </div>
        <div class="waiting-heading">Waiting for game<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
        <div class="waiting-sub">Scoreboard updates live when a game starts</div>
        <div class="live-badge"><span class="live-dot"></span> Live</div>
    </div>

    <div class="leaderboard" id="leaderboard"></div>

    <div id="chart-section">
        <div class="chart-title">Round breakdown &amp; progression <span>bars = per round · line = cumulative</span></div>
        <svg id="live-chart-svg" class="live-chart" viewBox="0 0 500 210" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="chart-legend" id="chart-legend"></div>
    </div>

    <div class="footer-links">
        <a href="stats.html?from=scoreboard" class="footer-link">📊 Stats &amp; History</a>
        <button class="footer-btn" id="shareBtn">🔗 Share Scoreboard</button>
    </div>

    <script type="module">
        import { db, ref, onValue } from './firebase-config.js';
        const gameRef = ref(db, 'currentGame');
        const scoreboardUrl = 'https://navs7.github.io/board-game-score/';

        document.getElementById('shareBtn').addEventListener('click', async () => {
            await navigator.clipboard.writeText(scoreboardUrl);
        });

        /* track previous state for animations */
        let prevRanks      = {};   /* playerName → rank index */
        let prevScores     = {};   /* playerName → score */
        let streaks        = {};   /* playerName → consecutive round wins */
        let prevRoundCount = 0;    /* last known completed round count */
        let isFirstRender  = true;

        const CHART_COLORS = ['#60a5fa','#f472b6','#34d399','#fbbf24','#a78bfa','#fb923c','#38bdf8','#e879f9'];

        function rearm(el, cls) {
            el.classList.remove(cls);
            void el.offsetWidth;
            el.classList.add(cls);
        }

        function renderLiveChart(playersArray, rankingOrder) {
            const chartSection = document.getElementById('chart-section');
            const svg = document.getElementById('live-chart-svg');
            const legendEl = document.getElementById('chart-legend');

            const histories = playersArray.map(p => {
                if (!p.history) return [];
                if (Array.isArray(p.history)) return p.history;
                return Object.values(p.history);
            });
            const numRounds = Math.max(...histories.map(h => h.length), 0);
            if (numRounds === 0) { chartSection.style.display = 'none'; return; }

            chartSection.style.display = 'block';

            const cumulatives = histories.map(hist => {
                let sum = 0;
                return hist.map(s => { sum += (s || 0); return sum; });
            });

            const W = 500, H = 210;
            const padL = 44, padR = 16, padT = 16, padB = 30;
            const plotW = W - padL - padR, plotH = H - padT - padB;

            const allRound = histories.flat().filter(s => s != null);
            const allCumul = cumulatives.flat().filter(s => s != null);
            let minY = Math.min(0, ...allRound);
            let maxY = Math.max(10, ...allCumul);
            const range = maxY - minY || 10;
            minY -= range * 0.08;
            maxY += range * 0.12;

            const yOf   = s => padT + plotH - ((s - minY) / (maxY - minY)) * plotH;
            const yBase = yOf(0);
            const groupW = plotW / numRounds;
            const barGap = 2;
            const barW   = Math.max(2, (groupW - barGap * (playersArray.length + 1)) / playersArray.length);

            let out = '';

            /* grid */
            for (let i = 0; i <= 4; i++) {
                const v = minY + (maxY - minY) * (i / 4), y = yOf(v);
                out += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>`;
                out += `<text x="${padL-5}" y="${(y+4).toFixed(1)}" text-anchor="end" fill="rgba(255,255,255,0.32)" font-size="10">${Math.round(v)}</text>`;
            }

            /* round labels */
            for (let r = 0; r < numRounds; r++) {
                const cx = padL + r * groupW + groupW / 2;
                out += `<text x="${cx.toFixed(1)}" y="${(padT+plotH+18).toFixed(1)}" text-anchor="middle" fill="rgba(255,255,255,0.32)" font-size="10">R${r+1}</text>`;
            }

            /* animated bars (per-round) */
            for (let r = 0; r < numRounds; r++) {
                const groupX = padL + r * groupW;
                playersArray.forEach((p, pi) => {
                    const color = CHART_COLORS[pi % CHART_COLORS.length];
                    const score = (histories[pi] || [])[r];
                    if (score == null) return;
                    const bx = groupX + barGap + pi * (barW + barGap);
                    const bh = Math.max(1, Math.abs(yOf(score) - yBase));
                    const by = score >= 0 ? yOf(score) : yBase;
                    const delay = ((r * 60 + pi * 25) / 1000).toFixed(3);
                    out += `<rect x="${bx.toFixed(1)}" y="${yBase.toFixed(1)}" width="${barW.toFixed(1)}" height="0" fill="${color}" opacity="0.6" rx="2">
                        <animate attributeName="height" from="0" to="${bh.toFixed(1)}" dur="0.45s" begin="${delay}s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
                        <animate attributeName="y" from="${yBase.toFixed(1)}" to="${by.toFixed(1)}" dur="0.45s" begin="${delay}s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
                    </rect>`;
                });
            }

            /* animated lines + dots (cumulative) — start after bars */
            const lineBase = ((numRounds * 60 + 100) / 1000).toFixed(3);
            playersArray.forEach((p, pi) => {
                const color = CHART_COLORS[pi % CHART_COLORS.length];
                const cumul = cumulatives[pi];
                if (!cumul.length) return;
                const pts = cumul.map((s, r) => `${(padL + r * groupW + groupW/2).toFixed(1)},${yOf(s).toFixed(1)}`).join(' ');
                const lineDelay = (parseFloat(lineBase) + pi * 0.1).toFixed(3);
                out += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5"
                    stroke-linejoin="round" stroke-linecap="round"
                    stroke-dasharray="1200" stroke-dashoffset="1200" opacity="0">
                    <animate attributeName="stroke-dashoffset" from="1200" to="0" dur="0.85s" begin="${lineDelay}s" fill="freeze" calcMode="spline" keySplines="0.25 1 0.5 1"/>
                    <animate attributeName="opacity" from="0" to="0.95" dur="0.05s" begin="${lineDelay}s" fill="freeze"/>
                </polyline>`;
                cumul.forEach((s, r) => {
                    const cx = (padL + r * groupW + groupW / 2).toFixed(1);
                    const cy = yOf(s).toFixed(1);
                    const dotDelay = (parseFloat(lineDelay) + 0.55 + r * 0.09).toFixed(3);
                    out += `<circle cx="${cx}" cy="${cy}" r="0" fill="${color}" stroke="#151e2d" stroke-width="2">
                        <animate attributeName="r" values="0;6;4" dur="0.28s" begin="${dotDelay}s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1;0.4 0 1 1"/>
                    </circle>`;
                });
            });

            svg.innerHTML = out;
            legendEl.innerHTML = playersArray.map((p, pi) =>
                `<span class="chart-legend-item"><span class="chart-legend-dot" style="background:${CHART_COLORS[pi%CHART_COLORS.length]}"></span>${p.name}</span>`
            ).join('');
        }

        onValue(gameRef, (snapshot) => {
            const data = snapshot.val();
            const waiting = document.getElementById('waiting-screen');
            const titleEl = document.getElementById('gameTitle');
            const leaderboard = document.getElementById('leaderboard');

            if (!data || data.gameStatus !== 'active') {
                waiting.classList.add('visible');
                titleEl.style.display = 'none';
                leaderboard.innerHTML = '';
                document.getElementById('chart-section').style.display = 'none';
                prevRanks      = {};
                prevScores     = {};
                streaks        = {};
                prevRoundCount = 0;
                isFirstRender  = true;
                return;
            }

            waiting.classList.remove('visible');
            titleEl.style.display = '';
            titleEl.innerText = data.gameName;

            let playersArray = [];
            for (let id in data.players) playersArray.push(data.players[id]);
            playersArray.sort((a, b) =>
                data.rankingOrder === 'highest'
                    ? b.totalScore - a.totalScore
                    : a.totalScore - b.totalScore
            );

            /* build new ranks map for this update */
            const newRanks  = {};
            const newScores = {};
            playersArray.forEach((p, i) => { newRanks[p.name] = i; newScores[p.name] = p.totalScore; });

            /* ── Round completion & streak tracking ── */
            /* Firebase stores arrays as objects {0:v, 1:v, …} — normalise back to array */
            const histories = playersArray.map(p => {
                if (!p.history) return [];
                if (Array.isArray(p.history)) return p.history;
                return Object.values(p.history);
            });
            const roundLengths = histories.map(h => h.length);
            const minRounds = roundLengths.length ? Math.min(...roundLengths) : 0;
            const allRoundsEqual = roundLengths.every(l => l === minRounds);
            let newStreakPlayer = null;

            if (isFirstRender) {
                /* compute streaks retroactively from all rounds already played */
                streaks = {};
                for (let round = 0; round < minRounds; round++) {
                    const roundScores = playersArray.map((p, i) => ({
                        name: p.name,
                        score: histories[i][round] ?? 0
                    }));
                    const roundWinner = roundScores.reduce((best, p) =>
                        data.rankingOrder === 'lowest'
                            ? (p.score < best.score ? p : best)
                            : (p.score > best.score ? p : best)
                    );
                    playersArray.forEach(p => {
                        if (p.name === roundWinner.name) {
                            streaks[p.name] = (streaks[p.name] || 0) + 1;
                        } else {
                            streaks[p.name] = 0;
                        }
                    });
                }
                prevRoundCount = minRounds;
            } else if (minRounds < prevRoundCount) {
                /* scores were reset — clear all streaks */
                streaks = {};
                prevRoundCount = minRounds;
            } else if (allRoundsEqual && minRounds > prevRoundCount) {
                /* a full round just finished — find its winner */
                const roundIdx = minRounds - 1;
                const roundScores = playersArray.map((p, i) => ({
                    name: p.name,
                    score: histories[i][roundIdx] ?? 0
                }));
                const roundWinner = roundScores.reduce((best, p) =>
                    data.rankingOrder === 'lowest'
                        ? (p.score < best.score ? p : best)
                        : (p.score > best.score ? p : best)
                );
                playersArray.forEach(p => {
                    if (p.name === roundWinner.name) {
                        streaks[p.name] = (streaks[p.name] || 0) + 1;
                        if (streaks[p.name] >= 2) newStreakPlayer = p.name;
                    } else {
                        streaks[p.name] = 0;
                    }
                });
                prevRoundCount = minRounds;
            }

            leaderboard.innerHTML = '';

            playersArray.forEach((player, index) => {
                const isTop = index === 0;

                const row = document.createElement('div');
                row.className = 'player-row' + (isTop ? ' top-rank' : '');

                const info = document.createElement('div');
                info.className = 'player-info';

                const rankSpan = document.createElement('span');
                rankSpan.className = 'rank';
                rankSpan.textContent = `#${index + 1}`;

                const name = document.createElement('strong');
                name.textContent = player.name;

                info.appendChild(rankSpan);
                info.appendChild(name);

                const scorePill = document.createElement('span');
                scorePill.className = 'score-pill';
                scorePill.textContent = player.totalScore;

                const rightSide = document.createElement('div');
                rightSide.style.cssText = 'display:flex;align-items:center;gap:0';
                rightSide.appendChild(scorePill);

                const streak = streaks[player.name] || 0;
                if (streak >= 2) {
                    const badge = document.createElement('span');
                    badge.className = 'streak-badge' + (player.name === newStreakPlayer ? ' streak-new' : '');
                    badge.innerHTML = `<span class="streak-icon">🔥</span> ${streak}`;
                    rightSide.appendChild(badge);
                }

                row.appendChild(info);
                row.appendChild(rightSide);
                leaderboard.appendChild(row);

                if (isFirstRender) {
                    /* staggered slide-in on game start */
                    row.style.animationDelay = `${index * 80}ms`;
                    row.classList.add('row-slide-in');
                } else {
                    const oldRank  = prevRanks[player.name];
                    const oldScore = prevScores[player.name];
                    const rankChanged  = oldRank !== undefined && oldRank !== index;
                    const scoreChanged = oldScore !== undefined && oldScore !== player.totalScore;

                    if (rankChanged) {
                        rearm(row, oldRank > index ? 'row-rank-up' : 'row-rank-down');
                    }
                    if (scoreChanged) {
                        rearm(scorePill, isTop ? 'score-changed-top' : 'score-changed');
                    }
                }
            });

            prevRanks  = newRanks;
            prevScores = newScores;
            isFirstRender = false;

            renderLiveChart(playersArray, data.rankingOrder);
        });
    </script>

    <script>
        (function spawnBgDice() {
            const icons = ['🎲','🎲','🎲','♟️','🃏','🎯','🏆','⭐'];
            function spawn() {
                const el = document.createElement('span');
                el.className = 'bg-dice';
                el.textContent = icons[Math.floor(Math.random() * icons.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.bottom = '-2rem';
                const dur = 8 + Math.random() * 10;
                el.style.animationDuration = dur + 's';
                el.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), dur * 1000);
            }
            setInterval(spawn, 900);
            for (let i = 0; i < 5; i++) setTimeout(spawn, i * 200);
        })();
    </script>
</body>
</html>
