<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Score Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: #1e293b;
            --border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --success-hover: #16a34a;
            --warning: #f59e0b;
            --warning-hover: #d97706;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        h1, h2, h3 { color: var(--text-main); text-align: center; margin-bottom: 16px; }
        h1 { margin-top: 20px; }

        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: var(--text-main);
        }

        input[type="text"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder { color: var(--text-muted); }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus { outline: none; border-color: var(--primary); }

        input[type="number"] {
            padding: 6px 6px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: var(--text-main);
            width: 65px;
            flex-shrink: 0;
            text-align: center;
        }

        input[type="number"]::placeholder { color: var(--text-muted); }
        input[type="number"]:focus { outline: none; border-color: var(--primary); }

        .radio-group {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .btn {
            cursor: pointer;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger-hover); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: var(--success-hover); }
        .btn-warning { background-color: var(--warning); color: #1a1a1a; }
        .btn-warning:hover { background-color: var(--warning-hover); }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-icon {
            cursor: pointer;
            border: none;
            border-radius: 7px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background-color 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        .btn-icon:hover { transform: scale(1.1); }
        .btn-icon:active { transform: scale(0.95); }
        .btn-icon-add { background-color: var(--primary); color: white; }
        .btn-icon-add:hover { background-color: var(--primary-hover); }
        .btn-icon-undo { background-color: var(--danger); color: white; }
        .btn-icon-undo:hover { background-color: var(--danger-hover); }

        /* 2-column player grid */
        #playersContainer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 0;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 12px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            gap: 6px;
        }

        .player-header .player-name {
            font-size: 0.95rem;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-total-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .player-total-label strong { color: var(--text-main); }

        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .small-text {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: block;
            margin-top: 7px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .share-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .share-bar input[type="text"] {
            margin-bottom: 0;
            font-size: 0.82rem;
            color: var(--text-muted);
            flex: 1;
        }

        .share-bar .btn {
            width: auto;
            padding: 10px 14px;
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .copy-feedback {
            font-size: 0.8rem;
            color: var(--success);
            text-align: center;
            margin-top: 8px;
            min-height: 1.2em;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 10px;
        }

        .top-bar h1 { margin: 0; font-size: 1.4rem; }
        .top-bar-actions { display: flex; gap: 8px; }

        .ghost-btn {
            cursor: pointer;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            background: transparent;
            color: var(--text-muted);
            transition: color 0.2s, border-color 0.2s;
            white-space: nowrap;
        }

        .ghost-btn:hover { color: var(--text-main); border-color: var(--text-muted); }
        .ghost-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 8px;
            min-height: 1.2em;
        }

        #login-section { margin-top: 60px; max-width: 420px; margin-left: auto; margin-right: auto; }
        #login-section h1 { margin-bottom: 8px; }
        #login-section .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        /* Chips */
        .chips-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 7px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .chips-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .chip {
            cursor: pointer;
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-muted);
            transition: border-color 0.15s, color 0.15s, background 0.15s;
            user-select: none;
        }

        .chip:hover { border-color: var(--primary); color: var(--primary); }
        .chip.selected { border-color: var(--primary); color: var(--primary); background: rgba(59,130,246,0.1); }

        @media (max-width: 480px) {
            #playersContainer { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Login -->
    <div id="login-section" style="display:none;">
        <h1>Game Admin Panel</h1>
        <p class="subtitle">Sign in to manage the scoreboard</p>
        <div class="panel">
            <form id="loginForm" onsubmit="return false;">
                <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
                <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
                <button class="btn" id="loginBtn">Sign In</button>
                <div class="error-msg" id="loginError"></div>
            </form>
        </div>
    </div>

    <!-- Admin -->
    <div id="admin-section" style="display:none;">
        <div class="top-bar">
            <h1>Game Admin Panel</h1>
            <div class="top-bar-actions">
                <a href="stats.html" style="text-decoration:none;"><button class="ghost-btn">📊 Stats</button></a>
                <button class="ghost-btn danger" id="signOutBtn">Sign out</button>
            </div>
        </div>

        <!-- New game -->
        <div id="new-game-section" class="panel">
            <h3>Create New Game</h3>

            <div id="knownGamesSection" style="display:none;">
                <div class="chips-label">Recent games — tap to use name:</div>
                <div class="chips-wrap" id="knownGameChips"></div>
            </div>

            <input type="text" id="gameName" placeholder="Game Name (e.g., Catan)">

            <div id="knownPlayersSection" style="display:none;">
                <div class="chips-label">Known players — tap to add:</div>
                <div class="chips-wrap" id="knownPlayerChips"></div>
            </div>

            <input type="text" id="playerNames" placeholder="Player names (comma separated)">

            <div class="radio-group">
                <label><input type="radio" name="rankingOrder" value="highest" checked> Highest Score Wins</label>
                <label><input type="radio" name="rankingOrder" value="lowest"> Lowest Score Wins</label>
            </div>
            <button class="btn" id="startGameBtn">Start New Game</button>
        </div>

        <!-- Active game -->
        <div id="active-game-section" style="display:none;">
            <h2 id="activeGameTitle"></h2>

            <div class="panel">
                <div class="share-bar">
                    <input type="text" id="shareUrl" readonly>
                    <button class="btn btn-success" id="copyLinkBtn">Copy Link</button>
                </div>
                <div class="copy-feedback" id="copyFeedback"></div>
            </div>

            <div id="playersContainer"></div>

            <div class="panel" style="margin-top:12px;">
                <div class="btn-row">
                    <button class="btn btn-warning" id="resetScoresBtn">↺ Reset Scores</button>
                    <button class="btn btn-danger" id="endGameBtn">✓ End &amp; Save Game</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            db, ref, set, onValue, get, push,
            auth, signInWithEmailAndPassword, signOut, onAuthStateChanged
        } from './firebase-config.js';

        const gameRef = ref(db, 'currentGame');
        const scoreboardUrl = window.location.origin + '/index.html';
        document.getElementById('shareUrl').value = scoreboardUrl;

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function sanitizeKey(name) {
            return name.toLowerCase().replace(/[.#$[\]/\s]/g, '_');
        }

        /* ── Auth ── */
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-section').style.display = 'block';
                loadKnownPlayers();
                loadKnownGames();
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('admin-section').style.display = 'none';
            }
        });

        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (e) {
                errorEl.textContent = 'Invalid email or password.';
            }
        }

        document.getElementById('loginBtn').addEventListener('click', doLogin);
        document.getElementById('loginForm').addEventListener('submit', doLogin);
        document.getElementById('signOutBtn').addEventListener('click', () => signOut(auth));

        /* ── Game name suggestions ── */
        function loadKnownGames() {
            onValue(ref(db, 'gameHistory'), (snapshot) => {
                const data = snapshot.val();
                const chipsWrap = document.getElementById('knownGameChips');
                const section = document.getElementById('knownGamesSection');
                chipsWrap.innerHTML = '';

                if (!data) { section.style.display = 'none'; return; }

                const seen = new Set();
                const names = Object.values(data)
                    .sort((a, b) => (b.endedAt || 0) - (a.endedAt || 0))
                    .map(g => g.gameName)
                    .filter(n => { if (seen.has(n)) return false; seen.add(n); return true; });

                if (names.length === 0) { section.style.display = 'none'; return; }

                section.style.display = 'block';
                names.forEach(name => {
                    const chip = document.createElement('div');
                    chip.className = 'chip';
                    chip.textContent = name;
                    chip.addEventListener('click', () => {
                        document.getElementById('gameName').value = name;
                        document.querySelectorAll('#knownGameChips .chip').forEach(c => c.classList.remove('selected'));
                        chip.classList.add('selected');
                    });
                    chipsWrap.appendChild(chip);
                });

                syncGameChipFromInput();
            });
        }

        function syncGameChipFromInput() {
            const val = document.getElementById('gameName').value.trim();
            document.querySelectorAll('#knownGameChips .chip').forEach(c => {
                c.classList.toggle('selected', c.textContent === val);
            });
        }

        document.getElementById('gameName').addEventListener('input', syncGameChipFromInput);

        /* ── Player name suggestions ── */
        function loadKnownPlayers() {
            onValue(ref(db, 'playerRecords'), (snapshot) => {
                const data = snapshot.val();
                const chipsWrap = document.getElementById('knownPlayerChips');
                const section = document.getElementById('knownPlayersSection');
                chipsWrap.innerHTML = '';
                if (!data) { section.style.display = 'none'; return; }

                const names = Object.values(data).map(p => p.name).sort();
                if (names.length === 0) { section.style.display = 'none'; return; }

                section.style.display = 'block';
                names.forEach(name => {
                    const chip = document.createElement('div');
                    chip.className = 'chip';
                    chip.textContent = name;
                    chip.addEventListener('click', () => togglePlayerChip(chip, name));
                    chipsWrap.appendChild(chip);
                });
                syncPlayerChipsFromInput();
            });
        }

        function getSelectedNames() {
            return document.getElementById('playerNames').value
                .split(',').map(n => n.trim()).filter(n => n.length > 0);
        }

        function syncPlayerChipsFromInput() {
            const selected = new Set(getSelectedNames());
            document.querySelectorAll('#knownPlayerChips .chip').forEach(chip => {
                chip.classList.toggle('selected', selected.has(chip.textContent));
            });
        }

        function togglePlayerChip(chip, name) {
            let names = getSelectedNames();
            const idx = names.indexOf(name);
            if (idx === -1) { names.push(name); } else { names.splice(idx, 1); }
            document.getElementById('playerNames').value = names.join(', ');
            syncPlayerChipsFromInput();
        }

        document.getElementById('playerNames').addEventListener('input', syncPlayerChipsFromInput);

        /* ── Copy link ── */
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(scoreboardUrl).then(() => {
                const fb = document.getElementById('copyFeedback');
                fb.textContent = 'Link copied to clipboard!';
                setTimeout(() => { fb.textContent = ''; }, 2500);
            });
        });

        /* ── Start game ── */
        document.getElementById('startGameBtn').addEventListener('click', () => {
            const gameName = document.getElementById('gameName').value.trim();
            const names = getSelectedNames();
            const rankingOrder = document.querySelector('input[name="rankingOrder"]:checked').value;

            if (!gameName) { alert('Please enter a game name.'); return; }
            if (names.length === 0) { alert('Please enter at least one player name.'); return; }

            const playersData = {};
            names.forEach((name, index) => {
                playersData[`player_${index}`] = { name, totalScore: 0, history: [] };
            });

            set(gameRef, { gameStatus: "active", gameName, rankingOrder, players: playersData, startedAt: Date.now() });
        });

        /* ── Reset scores ── */
        document.getElementById('resetScoresBtn').addEventListener('click', async () => {
            if (!confirm('Reset all scores to 0? This cannot be undone.')) return;
            const snapshot = await get(gameRef);
            const data = snapshot.val();
            Object.keys(data.players).forEach(pid => {
                data.players[pid].totalScore = 0;
                data.players[pid].history = [];
            });
            set(gameRef, data);
        });

        /* ── End game & save ── */
        document.getElementById('endGameBtn').addEventListener('click', async () => {
            if (!confirm('End this game and save final scores to history?')) return;

            const snapshot = await get(gameRef);
            const data = snapshot.val();
            if (!data || data.gameStatus !== 'active') return;

            const endedAt = Date.now();
            const playersArray = Object.values(data.players);
            playersArray.sort((a, b) =>
                data.rankingOrder === 'highest'
                    ? b.totalScore - a.totalScore
                    : a.totalScore - b.totalScore
            );

            const rankedPlayers = playersArray.map((p, i) => ({
                name: p.name, totalScore: p.totalScore, rank: i + 1, won: i === 0
            }));

            const historyRef = ref(db, 'gameHistory');
            const newGameRef = push(historyRef);
            const gameId = newGameRef.key;

            await set(newGameRef, {
                gameName: data.gameName,
                rankingOrder: data.rankingOrder,
                endedAt,
                players: rankedPlayers
            });

            for (const rp of rankedPlayers) {
                const key = sanitizeKey(rp.name);
                const prRef = ref(db, `playerRecords/${key}`);
                const prSnap = await get(prRef);
                const prData = prSnap.val() || { name: rp.name, games: {} };
                prData.name = rp.name;
                if (!prData.games) prData.games = {};
                prData.games[gameId] = {
                    gameName: data.gameName,
                    score: rp.totalScore,
                    rank: rp.rank,
                    won: rp.won,
                    totalPlayers: rankedPlayers.length,
                    endedAt
                };
                await set(prRef, prData);
            }

            await set(gameRef, { gameStatus: "ended" });
            document.getElementById('gameName').value = '';
            document.getElementById('playerNames').value = '';
            syncPlayerChipsFromInput();
            syncGameChipFromInput();
        });

        /* ── Live data ── */
        onValue(gameRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.gameStatus === "active") {
                document.getElementById('new-game-section').style.display = 'none';
                document.getElementById('active-game-section').style.display = 'block';
                document.getElementById('activeGameTitle').innerText = data.gameName;

                const container = document.getElementById('playersContainer');
                const existingIds = new Set(Array.from(container.children).map(c => c.dataset.playerId));
                const incomingIds = new Set(Object.keys(data.players));

                existingIds.forEach(id => {
                    if (!incomingIds.has(id)) container.querySelector(`[data-player-id="${id}"]`).remove();
                });

                Object.keys(data.players).forEach(playerId => {
                    const player = data.players[playerId];
                    const history = player.history || [];
                    let card = container.querySelector(`[data-player-id="${playerId}"]`);

                    if (!card) {
                        card = document.createElement('div');
                        card.className = 'player-card';
                        card.dataset.playerId = playerId;
                        card.innerHTML = `
                            <div class="player-header">
                                <span class="player-name"></span>
                                <span class="player-total-label">Total: <strong class="player-total"></strong></span>
                            </div>
                            <div class="controls">
                                <input type="number" id="score_${escapeHtml(playerId)}" placeholder="Score">
                                <button class="btn-icon btn-icon-add" title="Add Score" onclick="window.addScore('${escapeHtml(playerId)}')">&#10003;</button>
                                <button class="btn-icon btn-icon-undo" title="Undo Last" onclick="window.undoScore('${escapeHtml(playerId)}')">&#8630;</button>
                            </div>
                            <span class="small-text player-history"></span>
                        `;
                        container.appendChild(card);
                    }

                    card.querySelector('.player-name').textContent = player.name;
                    card.querySelector('.player-total').textContent = player.totalScore;
                    card.querySelector('.player-history').textContent =
                        history.length > 0 ? history.join(' → ') : 'No scores yet';
                });
            } else {
                document.getElementById('new-game-section').style.display = 'block';
                document.getElementById('active-game-section').style.display = 'none';
                document.getElementById('playersContainer').innerHTML = '';
            }
        });

        /* ── Score actions ── */
        window.addScore = async (playerId) => {
            const input = document.getElementById(`score_${playerId}`);
            if (input.value === '') return;
            const scoreNum = parseInt(input.value);
            if (isNaN(scoreNum)) return;

            const snapshot = await get(gameRef);
            const data = snapshot.val();
            const player = data.players[playerId];
            if (!player.history) player.history = [];
            player.history.push(scoreNum);
            player.totalScore += scoreNum;

            await set(gameRef, data);
            input.value = '';
        };

        window.undoScore = async (playerId) => {
            const snapshot = await get(gameRef);
            const data = snapshot.val();
            const player = data.players[playerId];
            if (!player.history || player.history.length === 0) return;
            player.totalScore -= player.history.pop();
            set(gameRef, data);
        };
    </script>
</body>
</html>
