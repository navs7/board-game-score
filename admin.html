<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Score Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: #1e293b;
            --border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --success-hover: #16a34a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }

        h1, h2, h3 { color: var(--text-main); text-align: center; margin-bottom: 16px; }
        h1 { margin-top: 20px; }

        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: var(--text-main);
        }

        input[type="text"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder { color: var(--text-muted); }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus { outline: none; border-color: var(--primary); }

        input[type="number"] {
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: var(--text-main);
            width: 100%;
        }

        input[type="number"]::placeholder { color: var(--text-muted); }
        input[type="number"]:focus { outline: none; border-color: var(--primary); }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .btn {
            cursor: pointer;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger-hover); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: var(--success-hover); }

        .btn-icon {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: background-color 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        .btn-icon:hover { transform: scale(1.1); }
        .btn-icon:active { transform: scale(0.95); }

        .btn-icon-add {
            background-color: var(--primary);
            color: white;
        }

        .btn-icon-add:hover { background-color: var(--primary-hover); }

        .btn-icon-undo {
            background-color: var(--danger);
            color: white;
        }

        .btn-icon-undo:hover { background-color: var(--danger-hover); }

        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 14px 16px;
            margin-bottom: 12px;
            border-radius: 12px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .controls input[type="number"] {
            flex: 1;
        }

        .small-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-top: 10px;
        }

        .share-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .share-bar input[type="text"] {
            margin-bottom: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            flex: 1;
        }

        .share-bar .btn {
            width: auto;
            padding: 10px 16px;
            white-space: nowrap;
        }

        .copy-feedback {
            font-size: 0.8rem;
            color: var(--success);
            text-align: center;
            margin-top: 8px;
            min-height: 1.2em;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .top-bar h2 { margin-bottom: 0; }

        .signout-btn {
            cursor: pointer;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            background: transparent;
            color: var(--text-muted);
            transition: color 0.2s, border-color 0.2s;
        }

        .signout-btn:hover { color: var(--danger); border-color: var(--danger); }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 8px;
            min-height: 1.2em;
        }

        /* Login screen */
        #login-section { margin-top: 60px; }
        #login-section h1 { margin-bottom: 8px; }
        #login-section .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

    <!-- Login -->
    <div id="login-section" style="display:none;">
        <h1>Game Admin Panel</h1>
        <p class="subtitle">Sign in to manage the scoreboard</p>
        <div class="panel">
            <form id="loginForm" onsubmit="return false;">
                <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
                <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
                <button class="btn" id="loginBtn">Sign In</button>
                <div class="error-msg" id="loginError"></div>
            </form>
        </div>
    </div>

    <!-- Admin (shown when authenticated) -->
    <div id="admin-section" style="display:none;">
        <div class="top-bar">
            <h1 style="margin:0;">Game Admin Panel</h1>
            <button class="signout-btn" id="signOutBtn">Sign out</button>
        </div>

        <div id="new-game-section" class="panel">
            <h3>Create New Game</h3>
            <input type="text" id="gameName" placeholder="Game Name (e.g., Catan)">
            <input type="text" id="playerNames" placeholder="Player Names (comma separated)">
            <div class="radio-group">
                <label><input type="radio" name="rankingOrder" value="highest" checked> Highest Score Wins</label>
                <label><input type="radio" name="rankingOrder" value="lowest"> Lowest Score Wins</label>
            </div>
            <button class="btn" id="startGameBtn">Start New Game</button>
        </div>

        <div id="active-game-section" style="display:none;">
            <h2 id="activeGameTitle"></h2>

            <div class="panel">
                <div class="share-bar">
                    <input type="text" id="shareUrl" readonly>
                    <button class="btn btn-success" id="copyLinkBtn">Copy Link</button>
                </div>
                <div class="copy-feedback" id="copyFeedback"></div>
            </div>

            <div id="playersContainer"></div>

            <div class="panel">
                <button class="btn btn-danger" id="endGameBtn">End Game &amp; Start New</button>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            db, ref, set, onValue, get,
            auth, signInWithEmailAndPassword, signOut, onAuthStateChanged
        } from './firebase-config.js';

        const gameRef = ref(db, 'currentGame');
        const scoreboardUrl = window.location.origin + '/index.html';
        document.getElementById('shareUrl').value = scoreboardUrl;

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /* ── Auth state ── */
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-section').style.display = 'block';
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('admin-section').style.display = 'none';
            }
        });

        /* ── Login ── */
        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (e) {
                errorEl.textContent = 'Invalid email or password.';
            }
        }

        document.getElementById('loginBtn').addEventListener('click', doLogin);
        document.getElementById('loginForm').addEventListener('submit', doLogin);

        /* ── Sign out ── */
        document.getElementById('signOutBtn').addEventListener('click', () => signOut(auth));

        /* ── Copy link ── */
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(scoreboardUrl).then(() => {
                const fb = document.getElementById('copyFeedback');
                fb.textContent = 'Link copied to clipboard!';
                setTimeout(() => { fb.textContent = ''; }, 2500);
            });
        });

        /* ── Start game ── */
        document.getElementById('startGameBtn').addEventListener('click', () => {
            const gameName = document.getElementById('gameName').value.trim();
            const names = document.getElementById('playerNames').value
                .split(',').map(n => n.trim()).filter(n => n.length > 0);
            const rankingOrder = document.querySelector('input[name="rankingOrder"]:checked').value;

            if (!gameName) { alert('Please enter a game name.'); return; }
            if (names.length === 0) { alert('Please enter at least one player name.'); return; }

            const playersData = {};
            names.forEach((name, index) => {
                playersData[`player_${index}`] = { name, totalScore: 0, history: [] };
            });

            set(gameRef, { gameStatus: "active", gameName, rankingOrder, players: playersData });
        });

        /* ── End game ── */
        document.getElementById('endGameBtn').addEventListener('click', () => {
            if (!confirm('Are you sure you want to end the current game?')) return;
            set(gameRef, { gameStatus: "ended" });
            document.getElementById('gameName').value = '';
            document.getElementById('playerNames').value = '';
        });

        /* ── Live data ── */
        onValue(gameRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.gameStatus === "active") {
                document.getElementById('new-game-section').style.display = 'none';
                document.getElementById('active-game-section').style.display = 'block';
                document.getElementById('activeGameTitle').innerText = data.gameName;

                const container = document.getElementById('playersContainer');
                const existingIds = new Set(Array.from(container.children).map(c => c.dataset.playerId));
                const incomingIds = new Set(Object.keys(data.players));

                existingIds.forEach(id => {
                    if (!incomingIds.has(id)) container.querySelector(`[data-player-id="${id}"]`).remove();
                });

                Object.keys(data.players).forEach(playerId => {
                    const player = data.players[playerId];
                    const history = player.history || [];
                    let card = container.querySelector(`[data-player-id="${playerId}"]`);

                    if (!card) {
                        card = document.createElement('div');
                        card.className = 'player-card';
                        card.dataset.playerId = playerId;
                        card.innerHTML = `
                            <div class="player-header">
                                <strong class="player-name"></strong>
                                <span style="color:var(--text-muted)">Total: <strong class="player-total" style="color:var(--text-main)"></strong></span>
                            </div>
                            <div class="controls">
                                <input type="number" id="score_${escapeHtml(playerId)}" placeholder="Score">
                                <button class="btn-icon btn-icon-add" title="Add Score" onclick="window.addScore('${escapeHtml(playerId)}')">&#10003;</button>
                                <button class="btn-icon btn-icon-undo" title="Undo Last" onclick="window.undoScore('${escapeHtml(playerId)}')">&#8630;</button>
                            </div>
                            <span class="small-text player-history"></span>
                        `;
                        container.appendChild(card);
                    }

                    card.querySelector('.player-name').textContent = player.name;
                    card.querySelector('.player-total').textContent = player.totalScore;
                    card.querySelector('.player-history').textContent =
                        'History: ' + (history.length > 0 ? history.join(' → ') : 'No scores yet');
                });
            } else {
                document.getElementById('new-game-section').style.display = 'block';
                document.getElementById('active-game-section').style.display = 'none';
                document.getElementById('playersContainer').innerHTML = '';
            }
        });

        /* ── Score actions ── */
        window.addScore = async (playerId) => {
            const input = document.getElementById(`score_${playerId}`);
            if (input.value === '') return;
            const scoreNum = parseInt(input.value);
            if (isNaN(scoreNum)) return;

            const snapshot = await get(gameRef);
            const data = snapshot.val();
            const player = data.players[playerId];
            if (!player.history) player.history = [];
            player.history.push(scoreNum);
            player.totalScore += scoreNum;

            await set(gameRef, data);
            input.value = '';
        };

        window.undoScore = async (playerId) => {
            const snapshot = await get(gameRef);
            const data = snapshot.val();
            const player = data.players[playerId];
            if (!player.history || player.history.length === 0) return;
            player.totalScore -= player.history.pop();
            set(gameRef, data);
        };
    </script>
</body>
</html>
