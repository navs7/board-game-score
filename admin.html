<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Score Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-color: #111111;
            --text-main: #efefef;
            --text-muted: #9a9a9a;
            --card-bg: #1e1e1e;
            --border: #2a2a2a;
            --primary: #e8621a;
            --primary-hover: #cf561a;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --success-hover: #16a34a;
            --warning: #e8621a;
            --warning-hover: #cf561a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        button, input, select, textarea { font-family: inherit; }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        h1, h2, h3 { color: var(--text-main); text-align: center; margin-bottom: 16px; }
        h1 { margin-top: 20px; }

        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Rubik', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
        }

        input[type="text"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder { color: var(--text-muted); }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus { outline: none; border-color: var(--primary); }

        input[type="number"] {
            padding: 6px 6px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Rubik', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            width: 65px;
            flex-shrink: 0;
            text-align: center;
        }

        input[type="number"]::placeholder { color: var(--text-muted); }
        input[type="number"]:focus { outline: none; border-color: var(--primary); }

        .radio-group {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .btn {
            cursor: pointer;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger-hover); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: var(--success-hover); }
        .btn-warning { background-color: var(--warning); color: #1a1a1a; }
        .btn-warning:hover { background-color: var(--warning-hover); }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-icon {
            cursor: pointer;
            border: none;
            border-radius: 7px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background-color 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        .btn-icon:hover { transform: scale(1.1); }
        .btn-icon:active { transform: scale(0.95); }
        .btn-icon-add { background-color: var(--primary); color: white; }
        .btn-icon-add:hover { background-color: var(--primary-hover); }
        .btn-icon-undo { background-color: var(--danger); color: white; }
        .btn-icon-undo:hover { background-color: var(--danger-hover); }

        /* 2-column player grid */
        #playersContainer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 0;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 12px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            gap: 6px;
        }

        .player-header .player-name {
            font-size: 0.95rem;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-total-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .player-total-label strong { color: var(--text-main); }

        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .controls input[type="number"] {
            width: 72px;
            font-size: 1rem;
            padding: 8px 8px;
        }

        .small-text {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: block;
            margin-top: 7px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .share-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .share-bar input[type="text"] {
            margin-bottom: 0;
            font-size: 0.82rem;
            color: var(--text-muted);
            flex: 1;
        }

        .share-bar .btn {
            width: auto;
            padding: 10px 14px;
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .btn-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .copy-feedback {
            font-size: 0.8rem;
            color: var(--success);
            text-align: center;
            margin-top: 8px;
            min-height: 1.2em;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 10px;
        }

        .top-bar h1 { margin: 0; font-size: 1.4rem; }
        .top-bar-actions { display: flex; gap: 8px; align-items: center; }

        @media (max-width: 520px) {
            .top-bar { flex-wrap: wrap; }
            .top-bar h1 { flex: 1 0 100%; font-size: 1.2rem; text-align: left; margin-bottom: 4px; }
            .top-bar-actions { margin-left: auto; }
        }

        .ghost-btn {
            cursor: pointer;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            background: transparent;
            color: var(--text-muted);
            transition: color 0.2s, border-color 0.2s;
            white-space: nowrap;
        }

        .ghost-btn:hover { color: var(--text-main); border-color: var(--text-muted); }
        .ghost-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 8px;
            min-height: 1.2em;
        }

        @media (max-width: 480px) {
            input[type="number"] {
                width: 84px;
                font-size: 1.05rem;
                padding: 10px 10px;
            }

            .controls input[type="number"] {
                width: 84px;
            }

            .btn-row-3 {
                grid-template-columns: 1fr;
            }
        }

        #login-section { margin-top: 60px; max-width: 420px; margin-left: auto; margin-right: auto; }
        #login-section h1 { margin-bottom: 8px; }
        #login-section .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        /* Chips */
        .chips-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 7px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .chips-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .chip {
            cursor: pointer;
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-muted);
            transition: border-color 0.15s, color 0.15s, background 0.15s;
            user-select: none;
        }

        .chip:hover { border-color: var(--primary); color: var(--primary); }
        .chip.selected { border-color: var(--primary); color: var(--primary); background: rgba(232,98,26,0.12); }

        @media (max-width: 480px) {
            #playersContainer { grid-template-columns: 1fr; }
        }

        .btn-row-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 480px) {
            .btn-row-2x2 { grid-template-columns: 1fr; }
        }

        .paused-game-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .paused-game-item:last-child { border-bottom: none; }
        .paused-game-info { flex: 1; min-width: 0; }
        .paused-game-name {
            font-weight: 700;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .paused-game-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .paused-game-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-sm {
            cursor: pointer;
            padding: 6px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            border: none;
            border-radius: 7px;
            transition: background-color 0.2s;
        }
        .btn-sm-primary { background: var(--primary); color: white; }
        .btn-sm-primary:hover { background: var(--primary-hover); }
        .btn-sm-danger { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
        .btn-sm-danger:hover { border-color: var(--danger); color: var(--danger); }
        .btn-pause { background-color: #7c3aed; color: white; }
        .btn-pause:hover { background-color: #6d28d9; }

        html[data-theme="light"] {
            --bg-color: #f5efe2;
            --card-bg: #ece4d3;
            --text-main: #111111;
            --text-muted: #555555;
            --border: #c4c4c4;
            --primary: #e8621a;
            --primary-hover: #cf561a;
        }
        html[data-theme="light"] input[type="text"],
        html[data-theme="light"] input[type="email"],
        html[data-theme="light"] input[type="password"],
        html[data-theme="light"] input[type="number"] { background: #e8dfce; }

        .theme-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, background 0.2s;
            line-height: 1;
            flex-shrink: 0;
        }
        .theme-toggle:hover { border-color: var(--primary); }
        html[data-theme="dark"]  .theme-toggle::before { content: '☀️'; }
        html[data-theme="light"] .theme-toggle::before { content: '🌙'; }
    </style>
    <script>
        (function() {
            var t = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <!-- Login -->
    <div id="login-section" style="display:none;">
        <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
            <button class="theme-toggle" onclick="(function(){var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);})()" title="Toggle theme"></button>
        </div>
        <h1>Game Admin Panel</h1>
        <p class="subtitle">Sign in to manage the scoreboard</p>
        <div class="panel">
            <form id="loginForm" onsubmit="return false;">
                <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
                <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
                <button class="btn" id="loginBtn">Sign In</button>
                <div class="error-msg" id="loginError"></div>
            </form>
        </div>
    </div>

    <!-- Admin -->
    <div id="admin-section" style="display:none;">
        <div class="top-bar">
            <h1>Game Admin Panel</h1>
            <div class="top-bar-actions">
                <button class="theme-toggle" id="themeToggle" onclick="(function(){var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);})()" title="Toggle theme"></button>
                <a href="stats.html?from=admin" style="text-decoration:none;"><button class="ghost-btn">📊 Stats</button></a>
                <button class="ghost-btn danger" id="signOutBtn">Sign out</button>
            </div>
        </div>

        <!-- New game -->
        <div id="new-game-section" class="panel">
            <h3>Create New Game</h3>

            <div id="knownGamesSection" style="display:none;">
                <div class="chips-label">Recent games — tap to use name:</div>
                <div class="chips-wrap" id="knownGameChips"></div>
            </div>

            <input type="text" id="gameName" placeholder="Game Name (e.g., Catan)">

            <div id="knownPlayersSection" style="display:none;">
                <div class="chips-label">Known players — tap to add:</div>
                <div class="chips-wrap" id="knownPlayerChips"></div>
            </div>

            <input type="text" id="playerNames" placeholder="Player names (comma separated)">

            <div class="radio-group">
                <label><input type="radio" name="rankingOrder" value="highest" checked> Highest Score Wins</label>
                <label><input type="radio" name="rankingOrder" value="lowest"> Lowest Score Wins</label>
            </div>
            <button class="btn" id="startGameBtn">Start New Game</button>
        </div>

        <!-- Active game -->
        <div id="active-game-section" style="display:none;">
            <h2 id="activeGameTitle"></h2>

            <div class="panel">
                <div class="share-bar">
                    <input type="text" id="shareUrl" readonly>
                    <button class="btn btn-success" id="copyLinkBtn">Copy Link</button>
                </div>
                <div class="copy-feedback" id="copyFeedback"></div>
            </div>

            <div id="playersContainer"></div>

            <div class="panel" style="margin-top:12px;">
                <div class="btn-row-2x2">
                    <button class="btn btn-pause" id="pauseGameBtn">⏸ Pause &amp; New Game</button>
                    <button class="btn btn-warning" id="resetScoresBtn">↺ Reset Scores</button>
                    <button class="btn btn-danger" id="endGameBtn">✓ End &amp; Save Game</button>
                    <button class="btn btn-danger" id="abandonGameBtn">✕ Abandon Game</button>
                </div>
            </div>
        </div>

        <!-- Paused games -->
        <div id="paused-games-section" class="panel" style="display:none; margin-top:0;">
            <h3 style="margin-bottom:12px;">⏸ Paused Games</h3>
            <div id="pausedGamesList"></div>
        </div>
    </div>

    <script type="module">
        import {
            db, ref, set, onValue, get, push,
            auth, signInWithEmailAndPassword, signOut, onAuthStateChanged
        } from './firebase-config.js';

        const gameRef = ref(db, 'currentGame');
        const scoreboardUrl = 'https://navs7.github.io/board-game-score/';
        document.getElementById('shareUrl').value = scoreboardUrl;

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function sanitizeKey(name) {
            return name.toLowerCase().replace(/[.#$[\]/\s]/g, '_');
        }

        /* ── Auth ── */
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-section').style.display = 'block';
                loadKnownPlayers();
                loadKnownGames();
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('admin-section').style.display = 'none';
            }
        });

        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (e) {
                errorEl.textContent = 'Invalid email or password.';
            }
        }

        document.getElementById('loginBtn').addEventListener('click', doLogin);
        document.getElementById('loginForm').addEventListener('submit', doLogin);
        document.getElementById('signOutBtn').addEventListener('click', () => signOut(auth));

        /* ── Game name suggestions ── */
        function loadKnownGames() {
            onValue(ref(db, 'gameHistory'), (snapshot) => {
                const data = snapshot.val();
                const chipsWrap = document.getElementById('knownGameChips');
                const section = document.getElementById('knownGamesSection');
                chipsWrap.innerHTML = '';

                if (!data) { section.style.display = 'none'; return; }

                const seen = new Set();
                const names = Object.values(data)
                    .sort((a, b) => (b.endedAt || 0) - (a.endedAt || 0))
                    .map(g => g.gameName)
                    .filter(n => { if (seen.has(n)) return false; seen.add(n); return true; })
                    .slice(0, 5);

                if (names.length === 0) { section.style.display = 'none'; return; }

                section.style.display = 'block';
                names.forEach(name => {
                    const chip = document.createElement('div');
                    chip.className = 'chip';
                    chip.textContent = name;
                    chip.addEventListener('click', () => {
                        document.getElementById('gameName').value = name;
                        document.querySelectorAll('#knownGameChips .chip').forEach(c => c.classList.remove('selected'));
                        chip.classList.add('selected');
                    });
                    chipsWrap.appendChild(chip);
                });

                syncGameChipFromInput();
            });
        }

        function syncGameChipFromInput() {
            const val = document.getElementById('gameName').value.trim();
            document.querySelectorAll('#knownGameChips .chip').forEach(c => {
                c.classList.toggle('selected', c.textContent === val);
            });
        }

        document.getElementById('gameName').addEventListener('input', syncGameChipFromInput);

        /* ── Player name suggestions ── */
        function loadKnownPlayers() {
            onValue(ref(db, 'playerRecords'), (snapshot) => {
                const data = snapshot.val();
                const chipsWrap = document.getElementById('knownPlayerChips');
                const section = document.getElementById('knownPlayersSection');
                chipsWrap.innerHTML = '';
                if (!data) { section.style.display = 'none'; return; }

                const names = Object.values(data)
                    .map(p => {
                        const games = p.games ? Object.values(p.games) : [];
                        const lastPlayed = games.reduce((max, g) => Math.max(max, g.endedAt || 0), 0);
                        return { name: p.name, lastPlayed };
                    })
                    .sort((a, b) => b.lastPlayed - a.lastPlayed)
                    .map(p => p.name)
                    .slice(0, 5);
                if (names.length === 0) { section.style.display = 'none'; return; }

                section.style.display = 'block';
                names.forEach(name => {
                    const chip = document.createElement('div');
                    chip.className = 'chip';
                    chip.textContent = name;
                    chip.addEventListener('click', () => togglePlayerChip(chip, name));
                    chipsWrap.appendChild(chip);
                });
                syncPlayerChipsFromInput();
            });
        }

        function getSelectedNames() {
            return document.getElementById('playerNames').value
                .split(',').map(n => n.trim()).filter(n => n.length > 0);
        }

        function syncPlayerChipsFromInput() {
            const selected = new Set(getSelectedNames());
            document.querySelectorAll('#knownPlayerChips .chip').forEach(chip => {
                chip.classList.toggle('selected', selected.has(chip.textContent));
            });
        }

        function togglePlayerChip(chip, name) {
            let names = getSelectedNames();
            const idx = names.indexOf(name);
            if (idx === -1) { names.push(name); } else { names.splice(idx, 1); }
            document.getElementById('playerNames').value = names.join(', ');
            syncPlayerChipsFromInput();
        }

        document.getElementById('playerNames').addEventListener('input', syncPlayerChipsFromInput);

        /* ── Copy link & open scoreboard ── */
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            const fb = document.getElementById('copyFeedback');

            /* Copy first (while we still have the user gesture), then open tab */
            function doOpen() {
                window.open(scoreboardUrl, '_blank');
                fb.textContent = 'Link opened & copied!';
                setTimeout(() => { fb.textContent = ''; }, 2500);
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(scoreboardUrl)
                    .then(doOpen)
                    .catch(() => {
                        /* Clipboard API blocked — use execCommand fallback */
                        const ta = document.createElement('textarea');
                        ta.value = scoreboardUrl;
                        ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        ta.remove();
                        doOpen();
                    });
            } else {
                /* Older browsers */
                const ta = document.createElement('textarea');
                ta.value = scoreboardUrl;
                ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                doOpen();
            }
        });

        /* ── Start game ── */
        document.getElementById('startGameBtn').addEventListener('click', () => {
            const gameName = document.getElementById('gameName').value.trim();
            const names = getSelectedNames();
            const rankingOrder = document.querySelector('input[name="rankingOrder"]:checked').value;

            if (!gameName) { alert('Please enter a game name.'); return; }
            if (names.length === 0) { alert('Please enter at least one player name.'); return; }

            const playersData = {};
            names.forEach((name, index) => {
                playersData[`player_${index}`] = { name, totalScore: 0, history: [] };
            });

            set(gameRef, { gameStatus: "active", gameName, rankingOrder, players: playersData, startedAt: Date.now() });
        });

        /* ── Reset scores ── */
        document.getElementById('resetScoresBtn').addEventListener('click', async () => {
            if (!confirm('Reset all scores to 0? This cannot be undone.')) return;
            const snapshot = await get(gameRef);
            const data = snapshot.val();
            Object.keys(data.players).forEach(pid => {
                data.players[pid].totalScore = 0;
                data.players[pid].history = [];
            });
            set(gameRef, data);
        });

        /* ── End game & save ── */
        document.getElementById('endGameBtn').addEventListener('click', async () => {
            if (!confirm('End this game and save final scores to history?')) return;

            const snapshot = await get(gameRef);
            const data = snapshot.val();
            if (!data || data.gameStatus !== 'active') return;

            const endedAt = Date.now();
            const playersArray = Object.values(data.players);
            playersArray.sort((a, b) =>
                data.rankingOrder === 'highest'
                    ? b.totalScore - a.totalScore
                    : a.totalScore - b.totalScore
            );

            const rankedPlayers = playersArray.map((p, i) => ({
                name: p.name, totalScore: p.totalScore, rank: i + 1, won: i === 0,
                history: p.history ? Object.values(p.history) : []
            }));

            const historyRef = ref(db, 'gameHistory');
            const newGameRef = push(historyRef);
            const gameId = newGameRef.key;

            await set(newGameRef, {
                gameName: data.gameName,
                rankingOrder: data.rankingOrder,
                winnerLabel: data.rankingOrder === 'highest' ? 'Highest Score Wins' : 'Lowest Score Wins',
                endedAt,
                players: rankedPlayers
            });

            for (const rp of rankedPlayers) {
                const key = sanitizeKey(rp.name);
                const prRef = ref(db, `playerRecords/${key}`);
                const prSnap = await get(prRef);
                const prData = prSnap.val() || { name: rp.name, games: {} };
                prData.name = rp.name;
                if (!prData.games) prData.games = {};
                prData.games[gameId] = {
                    gameName: data.gameName,
                    score: rp.totalScore,
                    rank: rp.rank,
                    won: rp.won,
                    winnerLabel: data.rankingOrder === 'highest' ? 'Highest Score Wins' : 'Lowest Score Wins',
                    totalPlayers: rankedPlayers.length,
                    endedAt,
                    roundHistory: rp.history || []
                };
                await set(prRef, prData);
            }

            await set(gameRef, { gameStatus: "ended" });
            document.getElementById('gameName').value = '';
            document.getElementById('playerNames').value = '';
            syncPlayerChipsFromInput();
            syncGameChipFromInput();
        });

        /* ── Live data ── */
        onValue(gameRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.gameStatus === "active") {
                document.getElementById('new-game-section').style.display = 'none';
                document.getElementById('active-game-section').style.display = 'block';
                document.getElementById('activeGameTitle').innerText = data.gameName;

                const container = document.getElementById('playersContainer');
                const existingIds = new Set(Array.from(container.children).map(c => c.dataset.playerId));
                const incomingIds = new Set(Object.keys(data.players));

                existingIds.forEach(id => {
                    if (!incomingIds.has(id)) container.querySelector(`[data-player-id="${id}"]`).remove();
                });

                Object.keys(data.players).forEach(playerId => {
                    const player = data.players[playerId];
                    const history = player.history
                        ? (Array.isArray(player.history) ? player.history : Object.values(player.history))
                        : [];
                    let card = container.querySelector(`[data-player-id="${playerId}"]`);

                    if (!card) {
                        card = document.createElement('div');
                        card.className = 'player-card';
                        card.dataset.playerId = playerId;
                        card.innerHTML = `
                            <div class="player-header">
                                <span class="player-name"></span>
                                <span class="player-total-label">Total: <strong class="player-total"></strong></span>
                            </div>
                            <div class="controls">
                                <input type="number" id="score_${escapeHtml(playerId)}" placeholder="Score">
                                <button class="btn-icon btn-icon-add" title="Add Score" onclick="window.addScore('${escapeHtml(playerId)}')">&#10003;</button>
                                <button class="btn-icon btn-icon-undo" title="Undo Last" onclick="window.undoScore('${escapeHtml(playerId)}')">&#8630;</button>
                            </div>
                            <span class="small-text player-history"></span>
                        `;
                        card.querySelector(`#score_${escapeHtml(playerId)}`).addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') window.addScore(playerId);
                        });
                        container.appendChild(card);
                    }

                    card.querySelector('.player-name').textContent = player.name;
                    card.querySelector('.player-total').textContent = player.totalScore;
                    card.querySelector('.player-history').textContent =
                        history.length > 0
                            ? history.map((s, i) => `R${i + 1}: ${s}`).join('  ·  ')
                            : 'No scores yet';
                });
            } else {
                document.getElementById('new-game-section').style.display = 'block';
                document.getElementById('active-game-section').style.display = 'none';
                document.getElementById('playersContainer').innerHTML = '';
            }
        });

        /* ── Score actions ── */
        window.addScore = async (playerId) => {
            const input = document.getElementById(`score_${playerId}`);
            if (input.value === '') return;
            const scoreNum = parseInt(input.value);
            if (isNaN(scoreNum)) return;

            const snapshot = await get(gameRef);
            const data = snapshot.val();
            const player = data.players[playerId];
            if (!player.history) player.history = [];
            player.history.push(scoreNum);
            player.totalScore += scoreNum;

            await set(gameRef, data);
            input.value = '';
            const playerIds = Object.keys(data.players || {});
            const nextPlayerId = playerIds[playerIds.indexOf(playerId) + 1];
            if (nextPlayerId) {
                const nextInput = document.getElementById(`score_${nextPlayerId}`);
                if (nextInput) nextInput.focus();
            }
        };

        window.undoScore = async (playerId) => {
            const snapshot = await get(gameRef);
            const data = snapshot.val();
            const player = data.players[playerId];
            if (!player.history || player.history.length === 0) return;
            player.totalScore -= player.history.pop();
            set(gameRef, data);
        };

        document.getElementById('abandonGameBtn').addEventListener('click', async () => {
            if (!confirm('Abandon this game without saving it?')) return;
            await set(gameRef, { gameStatus: 'ended' });
            document.getElementById('gameName').value = '';
            document.getElementById('playerNames').value = '';
            syncPlayerChipsFromInput();
            syncGameChipFromInput();
        });

        /* ── Pause & multi-match ── */
        const pausedGamesRef = ref(db, 'pausedGames');

        document.getElementById('pauseGameBtn').addEventListener('click', async () => {
            if (!confirm('Pause this game and start a new one? You can resume it anytime.')) return;
            const snapshot = await get(gameRef);
            const data = snapshot.val();
            if (!data || data.gameStatus !== 'active') return;

            /* save current game to pausedGames */
            await push(pausedGamesRef, { ...data, pausedAt: Date.now() });

            /* clear live game so scoreboard shows "waiting" */
            await set(gameRef, { gameStatus: 'ended' });

            document.getElementById('gameName').value = '';
            document.getElementById('playerNames').value = '';
            syncPlayerChipsFromInput();
            syncGameChipFromInput();
        });

        /* listen for paused games and render the panel */
        onValue(pausedGamesRef, (snapshot) => {
            const data = snapshot.val();
            const section = document.getElementById('paused-games-section');
            const list = document.getElementById('pausedGamesList');
            list.innerHTML = '';

            if (!data) { section.style.display = 'none'; return; }

            const entries = Object.entries(data).sort((a, b) => (b[1].pausedAt || 0) - (a[1].pausedAt || 0));
            if (!entries.length) { section.style.display = 'none'; return; }

            section.style.display = 'block';

            entries.forEach(([pausedId, game]) => {
                const playerNames = game.players
                    ? Object.values(game.players).map(p => escapeHtml(p.name)).join(', ')
                    : '';
                const pausedTime = game.pausedAt
                    ? new Date(game.pausedAt).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })
                    : '';

                const item = document.createElement('div');
                item.className = 'paused-game-item';
                item.innerHTML = `
                    <div class="paused-game-info">
                        <div class="paused-game-name">${escapeHtml(game.gameName || 'Untitled')}</div>
                        <div class="paused-game-sub">${playerNames}${pausedTime ? ' · paused ' + pausedTime : ''}</div>
                    </div>
                    <div class="paused-game-actions">
                        <button class="btn-sm btn-sm-primary resume-btn">▶ Resume</button>
                        <button class="btn-sm btn-sm-danger drop-btn">✕</button>
                    </div>
                `;

                item.querySelector('.resume-btn').addEventListener('click', async () => {
                    /* if a game is currently active, ask to handle it first */
                    const snap = await get(gameRef);
                    const live = snap.val();
                    if (live && live.gameStatus === 'active') {
                        const choice = confirm('A game is currently live. Pause it and switch to this one?');
                        if (!choice) return;
                        /* pause the live game first */
                        await push(pausedGamesRef, { ...live, pausedAt: Date.now() });
                    }
                    /* restore paused game as the live game */
                    const { pausedAt, ...gameData } = game;
                    await set(gameRef, { ...gameData, gameStatus: 'active' });
                    /* remove from paused list */
                    await set(ref(db, `pausedGames/${pausedId}`), null);
                });

                item.querySelector('.drop-btn').addEventListener('click', async () => {
                    if (!confirm(`Abandon the paused game "${game.gameName}"? It won't be saved.`)) return;
                    await set(ref(db, `pausedGames/${pausedId}`), null);
                });

                list.appendChild(item);
            });
        });
    </script>
</body>
</html>
