<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats - Score Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');

        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: #1e293b;
            --border: #334155;
            --primary: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 640px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            margin-top: 10px;
            gap: 10px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-bar h1 { font-size: 1.5rem; }

        .top-bar-right { display: flex; gap: 8px; align-items: center; }

        .ghost-btn {
            cursor: pointer;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            background: transparent;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s, border-color 0.2s;
            display: inline-block;
            white-space: nowrap;
        }

        .ghost-btn:hover { color: var(--text-main); border-color: var(--text-muted); }
        .ghost-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

        .admin-badge {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--warning);
            border: 1px solid var(--warning);
            padding: 4px 10px;
            border-radius: 20px;
            display: none;
        }

        body.is-admin .admin-badge { display: inline-block; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            cursor: pointer;
            padding: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--text-muted);
            transition: background 0.2s, color 0.2s;
        }

        .tab-btn.active { background: var(--primary); color: white; }

        /* Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .card:hover { border-color: var(--primary); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .card-header-left { flex: 1; min-width: 0; }
        .card-title { font-weight: 700; font-size: 1rem; }
        .card-subtitle { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; }

        .card-top3 {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-top: 5px;
        }
        .top3-item {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }
        .top3-medal { font-size: 0.85rem; }

        .winner-mode-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        /* ── Round breakdown table ── */
        .rounds-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .rounds-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .rounds-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .rounds-chart {
            width: 100%;
            height: auto;
            display: block;
        }
        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            margin-top: 8px;
            justify-content: center;
        }
        .chart-legend-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.74rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .chart-legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── Per-player round pills (inside player card game rows) ── */
        .player-rounds {
            flex-basis: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 6px;
            padding-top: 5px;
        }
        .round-pill {
            font-size: 0.70rem;
            background: rgba(255,255,255,0.07);
            border-radius: 4px;
            padding: 2px 7px;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
        }
        .rounds-table tr.totals-row td {
            border-top: 1px solid var(--border);
            font-weight: 700;
            color: var(--text-main);
        }
        .rounds-table tr.totals-row td.col-round {
            color: var(--text-muted);
        }

        .card-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .card-meta {
            font-size: 0.82rem;
            color: var(--text-muted);
            text-align: right;
        }

        /* Delete button — hidden until admin */
        .delete-btn {
            display: none;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 1rem;
            padding: 4px 6px;
            border-radius: 6px;
            line-height: 1;
            transition: color 0.15s, background 0.15s;
            flex-shrink: 0;
        }

        .delete-btn:hover { color: var(--danger); background: rgba(239,68,68,0.12); }

        body.can-delete .delete-btn { display: inline-flex; align-items: center; }

        .card-body {
            margin-top: 14px;
            display: none;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .card.open .card-body { display: block; }

        /* Rankings */
        .ranking-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .ranking-row:last-child { border-bottom: none; }

        .rank-badge {
            font-weight: 800;
            font-size: 1rem;
            min-width: 26px;
            text-align: center;
            color: var(--text-muted);
        }

        .rank-1 .rank-badge { color: #fbbf24; }
        .rank-2 .rank-badge { color: #94a3b8; }
        .rank-3 .rank-badge { color: #cd7c2f; }

        .rank-name { flex: 1; font-weight: 600; }

        .rank-score {
            font-size: 0.88rem;
            background: rgba(255,255,255,0.08);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .won-badge {
            font-size: 0.72rem;
            background: rgba(34,197,94,0.15);
            color: var(--success);
            border: 1px solid var(--success);
            padding: 2px 7px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* Player stats */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .stat-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 6px;
            text-align: center;
        }

        .stat-value { font-size: 1.3rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
        .stat-sublabel {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            opacity: 0.75;
        }

        .game-row {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.88rem;
            gap: 4px 8px;
        }

        .game-row:last-child { border-bottom: none; }
        .game-name { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .game-rank { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }
        .game-winner {
            margin-top: 4px;
            display: inline-flex;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
            font-size: 0.95rem;
        }

        .loading { text-align: center; color: var(--text-muted); padding: 30px; }

        .search-input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: var(--card-bg);
            color: var(--text-main);
        }

        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { outline: none; border-color: var(--primary); }

        /* Leaderboard */
        .sort-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
        }

        .sort-btn {
            cursor: pointer;
            padding: 7px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.15s;
        }

        .sort-btn:hover { border-color: var(--primary); color: var(--primary); }
        .sort-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

        .lb-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 8px;
            transition: border-color 0.15s;
        }

        .lb-row:hover { border-color: var(--primary); }

        .lb-row.lb-1 {
            background: linear-gradient(135deg, rgba(251,191,36,0.12) 0%, rgba(245,158,11,0.06) 100%);
            border-color: rgba(251,191,36,0.4);
        }

        .lb-row.lb-2 {
            background: linear-gradient(135deg, rgba(148,163,184,0.1) 0%, rgba(148,163,184,0.04) 100%);
            border-color: rgba(148,163,184,0.3);
        }

        .lb-row.lb-3 {
            background: linear-gradient(135deg, rgba(205,124,47,0.1) 0%, rgba(205,124,47,0.04) 100%);
            border-color: rgba(205,124,47,0.3);
        }

        .lb-rank {
            font-size: 1.2rem;
            font-weight: 800;
            min-width: 32px;
            text-align: center;
            color: var(--text-muted);
        }

        .lb-row.lb-1 .lb-rank { color: #fbbf24; }
        .lb-row.lb-2 .lb-rank { color: #94a3b8; }
        .lb-row.lb-3 .lb-rank { color: #cd7c2f; }

        .lb-name {
            flex: 1;
            font-weight: 700;
            font-size: 1rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lb-stats {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .lb-pill {
            font-size: 0.78rem;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 20px;
            background: rgba(255,255,255,0.07);
            color: var(--text-muted);
            white-space: nowrap;
        }

        .lb-pill.highlight {
            background: rgba(59,130,246,0.15);
            color: var(--primary);
        }

        .lb-games {
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .game-row {
                align-items: flex-start;
            }

            .game-row .game-name {
                flex: 1 1 100%;
            }

            .game-row .game-winner {
                order: -1;
                flex-basis: auto;
            }

            /* Leaderboard rows: name on top, stats below */
            .lb-row {
                flex-wrap: wrap;
                row-gap: 6px;
            }

            .lb-name {
                flex: 1 1 auto;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .lb-stats {
                flex-basis: 100%;
                padding-left: 44px;
                flex-shrink: 1;
            }
        }

        /* ── Confirmation modal ── */
        .confirm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .confirm-overlay.active { display: flex; }

        .confirm-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 24px 20px;
            max-width: 340px;
            width: 100%;
            text-align: center;
        }
        .confirm-box .confirm-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .confirm-box .confirm-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .confirm-box .confirm-msg {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .confirm-box .confirm-actions {
            display: flex;
            gap: 10px;
        }
        .confirm-box .confirm-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .confirm-btn-cancel {
            background: var(--border);
            color: var(--text-main);
        }
        .confirm-btn-delete {
            background: var(--danger);
            color: #fff;
        }
        .confirm-btn-cancel:active { opacity: 0.8; }
        .confirm-btn-delete:active { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-left">
            <h1>📊 Stats</h1>
            <a id="back-link" href="index.html" class="ghost-btn">← Scoreboard</a>
        </div>
        <div class="top-bar-right">
            <span class="admin-badge">🔑 Admin mode</span>
        </div>
    </div>
    <script>
        (function() {
            const from = new URLSearchParams(window.location.search).get('from');
            const link = document.getElementById('back-link');
            if (from === 'admin') {
                link.href = 'admin.html';
                link.textContent = '← Admin panel';
            } else {
                link.href = 'index.html';
                link.textContent = '← Scoreboard';
            }
        })();
    </script>

    <div class="tabs">
        <button class="tab-btn active" id="tab-lb-btn" onclick="switchTab('leaderboard')">🏆 Leaderboard</button>
        <button class="tab-btn" id="tab-games-btn" onclick="switchTab('games')">🎮 History</button>
        <button class="tab-btn" id="tab-players-btn" onclick="switchTab('players')">👤 Players</button>
    </div>

    <!-- Leaderboard tab -->
    <div id="tab-leaderboard">
        <div class="sort-bar">
            <button class="sort-btn active" id="sort-wins" onclick="setSort('wins')">🏆 Wins</button>
            <button class="sort-btn" id="sort-winrate" onclick="setSort('winrate')">📈 Win Rate</button>
        </div>
        <div class="loading" id="lb-loading">Loading leaderboard...</div>
        <div id="lb-list"></div>
    </div>

    <!-- Games tab -->
    <div id="tab-games" style="display:none;">
        <input type="text" class="search-input" id="game-search" placeholder="Search by game or player name...">
        <div class="loading" id="games-loading">Loading games...</div>
        <div id="games-list"></div>
    </div>

    <!-- Players tab -->
    <div id="tab-players" style="display:none;">
        <input type="text" class="search-input" id="player-search" placeholder="Search players...">
        <div class="loading" id="players-loading">Loading players...</div>
        <div id="players-list"></div>
    </div>

    <script type="module">
        import { db, ref, onValue, remove, auth, onAuthStateChanged } from './firebase-config.js';

        /* ── Auth state → admin mode ── */
        const DELETE_ADMIN = '07navneet@gmail.com';
        const fromAdmin = new URLSearchParams(window.location.search).get('from') === 'admin';

        onAuthStateChanged(auth, (user) => {
            const isPrivileged = !!(user && user.email === DELETE_ADMIN && fromAdmin);
            document.body.classList.toggle('is-admin', isPrivileged);
            document.body.classList.toggle('can-delete', isPrivileged);
        });

        window.switchTab = function(tab) {
            document.getElementById('tab-leaderboard').style.display = tab === 'leaderboard' ? 'block' : 'none';
            document.getElementById('tab-games').style.display = tab === 'games' ? 'block' : 'none';
            document.getElementById('tab-players').style.display = tab === 'players' ? 'block' : 'none';
            document.getElementById('tab-lb-btn').classList.toggle('active', tab === 'leaderboard');
            document.getElementById('tab-games-btn').classList.toggle('active', tab === 'games');
            document.getElementById('tab-players-btn').classList.toggle('active', tab === 'players');
        };

        function formatDate(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatDateTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const date = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
            const time = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
            return `${date}, ${time}`;
        }

        function getWinnerLabel(mode) {
            return mode === 'lowest' ? 'Lowest Score Winner' : 'Highest Score Winner';
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /* ── Game History ── */
        let allGamesData = [];

        function renderGames(games) {
            const container = document.getElementById('games-list');
            container.innerHTML = '';

            if (!games.length) {
                container.innerHTML = '<div class="empty-state">No games match your search.</div>';
                return;
            }

            games.forEach(game => {
                const winnerLabel = getWinnerLabel(game.rankingOrder);

                const card = document.createElement('div');
                card.className = 'card';

                const header = document.createElement('div');
                header.className = 'card-header';
                const medals = ['🥇', '🥈', '🥉'];
                const top3 = [...(game.players || [])].sort((a, b) => a.rank - b.rank).slice(0, 3);
                const top3html = top3.map((p, i) =>
                    `<span class="top3-item"><span class="top3-medal">${medals[i]}</span>${escapeHtml(p.name)}</span>`
                ).join('');
                const playerCount = game.players ? game.players.length : 0;

                header.innerHTML = `
                    <div class="card-header-left">
                        <div class="card-title">${escapeHtml(game.gameName)}</div>
                        <div class="card-subtitle">${formatDateTime(game.endedAt)} &nbsp;·&nbsp; ${playerCount} player${playerCount !== 1 ? 's' : ''}</div>
                        <div class="card-top3">${top3html}</div>
                    </div>
                    <div class="card-header-right">
                        <button class="delete-btn" title="Delete this game">🗑️</button>
                    </div>
                `;

                const deleteBtn = header.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const ok = await confirmDelete(
                        `Delete "${game.gameName}"?`,
                        'This game will be permanently removed from history. This cannot be undone.'
                    );
                    if (!ok) return;
                    remove(ref(db, `gameHistory/${game.id}`));
                });

                const body = document.createElement('div');
                body.className = 'card-body';
                body.innerHTML = `<div class="winner-mode-label">${escapeHtml(winnerLabel)}</div>`
                    + renderRankings(game.players || [])
                    + renderRoundsChart(game.players || [], game.rankingOrder);

                card.appendChild(header);
                card.appendChild(body);
                card.addEventListener('click', () => card.classList.toggle('open'));
                container.appendChild(card);
            });
        }

        onValue(ref(db, 'gameHistory'), (snapshot) => {
            document.getElementById('games-loading').style.display = 'none';
            const data = snapshot.val();

            if (!data) {
                allGamesData = [];
                document.getElementById('games-list').innerHTML =
                    '<div class="empty-state">No completed games yet.<br>End a game in the admin panel to save it here.</div>';
                return;
            }

            allGamesData = Object.entries(data)
                .map(([id, g]) => ({ id, ...g }))
                .sort((a, b) => (b.endedAt || 0) - (a.endedAt || 0));

            const q = document.getElementById('game-search').value.trim().toLowerCase();
            renderGames(q ? allGamesData.filter(g => filterGame(g, q)) : allGamesData);
        });

        function filterGame(game, q) {
            if (game.gameName.toLowerCase().includes(q)) return true;
            return (game.players || []).some(p => p.name.toLowerCase().includes(q));
        }

        document.getElementById('game-search').addEventListener('input', function () {
            const q = this.value.trim().toLowerCase();
            renderGames(q ? allGamesData.filter(g => filterGame(g, q)) : allGamesData);
        });

        const CHART_COLORS = ['#60a5fa','#f472b6','#34d399','#fbbf24','#a78bfa','#fb923c','#38bdf8','#e879f9'];

        function renderRankings(players) {
            const sorted = [...players].sort((a, b) => a.rank - b.rank);
            return sorted.map((p, i) => `
                <div class="ranking-row rank-${p.rank}">
                    <span class="rank-badge">#${p.rank}</span>
                    <span class="rank-name" style="color:${CHART_COLORS[i % CHART_COLORS.length]}">${escapeHtml(p.name)}</span>
                    ${p.won ? '<span class="won-badge">Winner</span>' : ''}
                    <span class="rank-score">${p.totalScore} pts</span>
                </div>
            `).join('');
        }

        function renderRoundsChart(players, rankingOrder) {
            const COLORS = CHART_COLORS;

            /* normalise Firebase object-arrays */
            const sorted = [...players].sort((a, b) => a.rank - b.rank);
            const histories = sorted.map(p =>
                p.history ? (Array.isArray(p.history) ? p.history : Object.values(p.history)) : []
            );
            const numRounds = Math.max(...histories.map(h => h.length), 0);
            if (numRounds === 0) return '';

            const W = 500, H = 190;
            const padL = 42, padR = 14, padT = 14, padB = 30;
            const plotW = W - padL - padR, plotH = H - padT - padB;

            const allScores = histories.flat().filter(s => s !== undefined && s !== null);
            let minY = Math.min(...allScores), maxY = Math.max(...allScores);
            if (minY === maxY) { minY -= 5; maxY += 5; }
            const yr = maxY - minY;
            minY -= yr * 0.12; maxY += yr * 0.12;

            const xOf = r => numRounds === 1 ? padL + plotW / 2 : padL + (r / (numRounds - 1)) * plotW;
            const yOf = s => padT + plotH - ((s - minY) / (maxY - minY)) * plotH;

            let grid = '', yLbls = '', xLbls = '', lines = '';

            for (let i = 0; i <= 4; i++) {
                const val = minY + (maxY - minY) * (i / 4), y = yOf(val);
                grid  += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>`;
                yLbls += `<text x="${padL-5}" y="${(y+4).toFixed(1)}" text-anchor="end" fill="rgba(255,255,255,0.32)" font-size="10">${Math.round(val)}</text>`;
            }
            for (let r = 0; r < numRounds; r++) {
                xLbls += `<text x="${xOf(r).toFixed(1)}" y="${(padT+plotH+18).toFixed(1)}" text-anchor="middle" fill="rgba(255,255,255,0.32)" font-size="10">R${r+1}</text>`;
            }

            sorted.forEach((p, pi) => {
                const color = COLORS[pi % COLORS.length], hist = histories[pi];
                if (!hist.length) return;
                const pts = hist.map((s, r) => `${xOf(r).toFixed(1)},${yOf(s).toFixed(1)}`).join(' ');
                lines += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>`;
                hist.forEach((s, r) => {
                    lines += `<circle cx="${xOf(r).toFixed(1)}" cy="${yOf(s).toFixed(1)}" r="4" fill="${color}" stroke="#151e2d" stroke-width="2"><title>${escapeHtml(p.name)} R${r+1}: ${s}</title></circle>`;
                });
            });

            const legend = sorted.map((p, pi) =>
                `<span class="chart-legend-item"><span class="chart-legend-dot" style="background:${COLORS[pi%COLORS.length]}"></span>${escapeHtml(p.name)}</span>`
            ).join('');

            return `
                <div class="rounds-section">
                    <div class="rounds-header">
                        <span class="rounds-label">Round breakdown</span>
                    </div>
                    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="rounds-chart">${grid}${yLbls}${xLbls}${lines}</svg>
                    <div class="chart-legend">${legend}</div>
                </div>
            `;
        }

        /* ── Player Records + Leaderboard ── */
        let allPlayersData = [];
        let currentSort = 'wins';

        window.setSort = function(sort) {
            currentSort = sort;
            ['wins','winrate'].forEach(s => {
                document.getElementById('sort-' + s).classList.toggle('active', s === sort);
            });
            renderLeaderboard(allPlayersData);
        };

        function computeStats(player) {
            const games = player.games
                ? Object.entries(player.games).map(([id, g]) => ({ id, ...g }))
                : [];
            const totalGames = games.length;
            const wins = games.filter(g => g.won).length;
            const winRate = totalGames > 0 ? Math.round((wins / totalGames) * 100) : 0;
            return { totalGames, wins, winRate };
        }

        function renderLeaderboard(players) {
            document.getElementById('lb-loading').style.display = 'none';
            const container = document.getElementById('lb-list');
            container.innerHTML = '';

            if (!players || players.length === 0) {
                container.innerHTML = '<div class="empty-state">No player records yet.<br>Complete a game to build the leaderboard.</div>';
                return;
            }

            const enriched = players.map(p => ({ ...p, ...computeStats(p) }));

            const sorted = [...enriched].sort((a, b) => {
                if (currentSort === 'wins') {
                    return b.wins !== a.wins ? b.wins - a.wins : b.winRate - a.winRate;
                } else {
                    return b.winRate !== a.winRate ? b.winRate - a.winRate : b.wins - a.wins;
                }
            });

            const medals = ['🥇', '🥈', '🥉'];

            sorted.forEach((player, i) => {
                const pos = i + 1;
                const rankLabel = pos <= 3 ? medals[i] : `#${pos}`;

                let highlightPill, otherPill;
                if (currentSort === 'wins') {
                    highlightPill = `<span class="lb-pill highlight">${player.wins} win${player.wins !== 1 ? 's' : ''}</span>`;
                    otherPill = `<span class="lb-pill">${player.winRate}% rate</span>`;
                } else {
                    highlightPill = `<span class="lb-pill highlight">${player.winRate}% win rate</span>`;
                    otherPill = `<span class="lb-pill">${player.wins} win${player.wins !== 1 ? 's' : ''}</span>`;
                }

                const row = document.createElement('div');
                row.className = `lb-row${pos <= 3 ? ' lb-' + pos : ''}`;
                row.innerHTML = `
                    <span class="lb-rank">${rankLabel}</span>
                    <span class="lb-name">${escapeHtml(player.name)}</span>
                    <div class="lb-stats">
                        ${highlightPill}
                        ${otherPill}
                        <span class="lb-games">${player.totalGames}G</span>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        onValue(ref(db, 'playerRecords'), (snapshot) => {
            document.getElementById('players-loading').style.display = 'none';
            document.getElementById('lb-loading').style.display = 'none';
            const data = snapshot.val();
            const container = document.getElementById('players-list');
            container.innerHTML = '';

            if (!data) {
                container.innerHTML = '<div class="empty-state">No player records yet.<br>Complete a game to start tracking players.</div>';
                renderLeaderboard([]);
                return;
            }

            allPlayersData = Object.entries(data)
                .map(([key, p]) => ({ key, ...p }))
                .sort((a, b) => a.name.localeCompare(b.name));

            renderLeaderboard(allPlayersData);
            renderPlayers(allPlayersData);
        });

        function renderPlayers(players) {
            const container = document.getElementById('players-list');
            container.innerHTML = '';

            if (players.length === 0) {
                container.innerHTML = '<div class="empty-state">No players match your search.</div>';
                return;
            }

            players.forEach(player => {
                const games = player.games
                    ? Object.entries(player.games).map(([id, g]) => ({ id, ...g }))
                    : [];
                games.sort((a, b) => (b.endedAt || 0) - (a.endedAt || 0));

                const totalGames = games.length;
                const wins = games.filter(g => g.won).length;
                const avgScore = totalGames > 0
                    ? Math.round(games.reduce((sum, g) => sum + (g.score || 0), 0) / totalGames)
                    : 0;

                const wonGames = games.filter(g => g.won);
                const bestWin = wonGames.length
                    ? wonGames.reduce((best, g) => {
                        const gBetter = g.winnerLabel === 'Lowest Score Wins'
                            ? g.score < best.score
                            : g.score > best.score;
                        return gBetter ? g : best;
                    })
                    : null;

                const gameRows = games.map(g => {
                    const rounds = g.roundHistory
                        ? (Array.isArray(g.roundHistory) ? g.roundHistory : Object.values(g.roundHistory))
                        : [];
                    const roundPills = (g.won && rounds.length)
                        ? `<div class="player-rounds">${rounds.map((s, i) => `<span class="round-pill">R${i + 1}: ${s}</span>`).join('')}</div>`
                        : '';
                    return `
                    <div class="game-row">
                        <span class="game-name">${escapeHtml(g.gameName)}</span>
                        ${g.won ? `<span class="won-badge game-winner">🏆 Won</span>` : ''}
                        <span class="game-rank">#${g.rank} of ${g.totalPlayers}</span>
                        <span class="rank-score">${g.score} pts</span>
                        <span style="font-size:0.75rem;color:var(--text-muted);white-space:nowrap;">${formatDate(g.endedAt)}</span>
                        ${roundPills}
                    </div>`;
                }).join('') || '<div style="color:var(--text-muted);font-size:0.85rem;padding:8px 0;">No game history.</div>';

                const card = document.createElement('div');
                card.className = 'card';

                const header = document.createElement('div');
                header.className = 'card-header';
                header.innerHTML = `
                    <div class="card-header-left">
                        <div class="card-title">${escapeHtml(player.name)}</div>
                        <div class="card-subtitle">${totalGames} game${totalGames !== 1 ? 's' : ''} played</div>
                    </div>
                    <div class="card-header-right">
                        <span class="card-meta">${wins} win${wins !== 1 ? 's' : ''}</span>
                        <button class="delete-btn" title="Delete this player">🗑️</button>
                    </div>
                `;

                const deleteBtn = header.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const ok = await confirmDelete(
                        `Delete "${player.name}"?`,
                        'All stats and game history for this player will be permanently removed. This cannot be undone.'
                    );
                    if (!ok) return;
                    remove(ref(db, `playerRecords/${player.key}`));
                });

                const body = document.createElement('div');
                body.className = 'card-body';
                const bestWinHtml = bestWin
                    ? `<div class="stat-value">${bestWin.score}</div>
                       <div class="stat-label">Best Win</div>
                       <div class="stat-sublabel" title="${escapeHtml(bestWin.gameName)}">${escapeHtml(bestWin.gameName)}</div>`
                    : `<div class="stat-value" style="font-size:1rem;opacity:0.4">—</div>
                       <div class="stat-label">Best Win</div>`;

                body.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat-box">
                            <div class="stat-value">${totalGames}</div>
                            <div class="stat-label">Games</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${wins}</div>
                            <div class="stat-label">Wins</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${avgScore}</div>
                            <div class="stat-label">Avg Score</div>
                        </div>
                        <div class="stat-box">${bestWinHtml}</div>
                    </div>
                    <div>${gameRows}</div>
                `;

                card.appendChild(header);
                card.appendChild(body);
                card.addEventListener('click', () => card.classList.toggle('open'));
                container.appendChild(card);
            });
        }

        document.getElementById('player-search').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            renderPlayers(allPlayersData.filter(p => p.name.toLowerCase().includes(q)));
        });
    </script>

    <!-- Confirmation modal -->
    <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-box">
            <div class="confirm-icon">🗑️</div>
            <div class="confirm-title" id="confirm-title"></div>
            <div class="confirm-msg" id="confirm-msg"></div>
            <div class="confirm-actions">
                <button class="confirm-btn-cancel" id="confirm-cancel">Cancel</button>
                <button class="confirm-btn-delete" id="confirm-ok">Delete</button>
            </div>
        </div>
    </div>

    <script>
        function confirmDelete(title, message) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('confirm-overlay');
                document.getElementById('confirm-title').textContent = title;
                document.getElementById('confirm-msg').textContent = message;
                overlay.classList.add('active');

                function finish(result) {
                    overlay.classList.remove('active');
                    document.getElementById('confirm-ok').removeEventListener('click', onOk);
                    document.getElementById('confirm-cancel').removeEventListener('click', onCancel);
                    overlay.removeEventListener('click', onOverlay);
                    resolve(result);
                }
                function onOk() { finish(true); }
                function onCancel() { finish(false); }
                function onOverlay(e) { if (e.target === overlay) finish(false); }

                document.getElementById('confirm-ok').addEventListener('click', onOk);
                document.getElementById('confirm-cancel').addEventListener('click', onCancel);
                overlay.addEventListener('click', onOverlay);
            });
        }
    </script>
</body>
</html>
